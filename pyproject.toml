[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-sidekick-adk"
version = "0.1.0"
description = "Google ADK sequential & scheduled agent pipeline that curates tweets into LinkedIn posts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "google-adk>=2.0,<3",
    "google-genai>=2.0,<3",
    "twikit>=2.1,<3",
    "playwright>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
sidekick = "src.runner:main"

[tool.setuptools]
packages = [
    "src",
    "src.agent",
    "src.twitter",
    "src.render",
    "src.linkedin",
    "src.storage",
]

# ---------------------------------------------------------------------------
# Test configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:google.adk.agents.sequential_agent",
]

# ---------------------------------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "build", "dist", ".assets", "state"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "SIM108", # ternary operator reads worse for the branchy runner logic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy (static type validation)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["twikit.*", "playwright.*"]
ignore_missing_imports = true
